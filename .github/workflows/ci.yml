name: CI

permissions:
  contents: read

on:
  pull_request:

jobs:
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Only unit tests run in CI. The live e2e suite (tests/e2e) requires real
      # tenant credentials in a local .env and is intentionally NOT run in CI —
      # it mutates a real tenant and creates undeletable Messaging topics.
      - name: Unit tests
        run: pnpm test:unit

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck



